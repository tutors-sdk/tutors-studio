name: Front door

# Builds Studio's one-page website and records its film from the browser preview, then publishes both to
# GitHub Pages (ADR 0054). A screen change that breaks the walkthrough fails here, at the step it broke.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/**"
      - "public/**"
      - "scripts/film.ts"
      - "scripts/front-door.ts"
      - "docs/install.md"
      - ".github/workflows/front-door.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: front-door
  cancel-in-progress: true

jobs:
  build:
    name: Build the page and record the film
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chromium for the film, and ffmpeg for its MP4
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg
      - run: pnpm front-door _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
